name: Build and Test

on:
  workflow_dispatch:

jobs:
  build-test-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcode-select -p

      - name: Probe simulator runtimes and devices
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          xcodebuild -project BUDGET.xcodeproj -scheme BUDGET -showdestinations || true

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available | \
            grep -E 'iPhone' | \
            grep -v 'unavailable' | \
            head -1 | \
            grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | \
            head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $DEVICE_ID"
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Boot selected simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build for testing
        run: |
          xcodebuild \
            -project BUDGET.xcodeproj \
            -scheme BUDGET \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Run XCTest
        run: |
          xcodebuild \
            -project BUDGET.xcodeproj \
            -scheme BUDGET \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Build generic iOS device (unsigned)
        run: |
          xcodebuild \
            -project BUDGET.xcodeproj \
            -scheme BUDGET \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=app.budget.local \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find derived -name 'BUDGET.app' -type d | head -n 1)
          echo "Found app: $APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/BUDGET.app
          zip -r BUDGET-unsigned.ipa Payload
          ls -lh BUDGET-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BUDGET-unsigned-ipa
          path: BUDGET-unsigned.ipa
          if-no-files-found: error
